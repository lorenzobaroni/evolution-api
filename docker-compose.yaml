services:
  evolution_api:
    container_name: evolution_api
    image: atendai/evolution-api:v1.8.7
    restart: unless-stopped
    depends_on:
      - evolution_redis
    ports:
      - "8080:8080"
    env_file:
      - .env
    networks:
      - evolution-net
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          memory: 512M

  evolution_redis:
    image: redis:latest
    container_name: evolution_redis
    hostname: evolution_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - evolution-net
    deploy:
      resources:
        limits:
          memory: 128M
  
  frontend:
    container_name: evolution_frontend
    image: atendai/evolution-manager:latest
    restart: always
    ports:
      - "3000:80"
    environment:
      - NEXT_PUBLIC_API_URL=https://evolution-api-production-0a7f.up.railway.app
      - NODE_ENV=production
      - TZ=America/Sao_Paulo
    depends_on:
      - evolution_api
    networks:
      - evolution-net

networks:
  evolution-net:
    driver: bridge
